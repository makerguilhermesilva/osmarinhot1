<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Resultado - Exploração do Oceano</title>
  <style>
    :root {
      --bg:#031922;
      --card:#063341;
      --muted:#9fd3e6;
      --accent:#00bcd4;
      --accent-2:#0077b6;
      --text:#e6fbff;
      --shadow:0 8px 30px rgba(1,18,25,0.6);
      font-family: "Inter", "Segoe UI", Roboto, Arial, sans-serif;
    }

    body {
      background: linear-gradient(180deg, var(--bg), #064257 80%);
      color: var(--text);
      font-family: "Inter", sans-serif;
      text-align: center;
      padding: 60px 20px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    h1 {
      margin-bottom: 8px;
      color: var(--accent);
      text-shadow: 0 2px 8px rgba(0,0,0,0.5);
    }

    h2 {
      color: var(--accent-2);
      font-size: 1.8rem;
      margin-top: 0.3rem;
      margin-bottom: 0.4rem;
      text-transform: capitalize;
    }

    p {
      font-size: 1.1rem;
      color: var(--muted);
      margin-bottom: 24px;
    }

    .card {
      background: var(--card);
      border-radius: 16px;
      padding: 24px;
      box-shadow: var(--shadow);
      max-width: 420px;
      width: 100%;
      transition: transform 0.4s ease, box-shadow 0.4s ease;
      animation: fadeInUp 0.8s ease;
    }

    .card:hover {
      transform: translateY(-6px);
      box-shadow: 0 12px 32px rgba(0,0,0,0.4);
    }

    .card img {
      max-width: 100%;
      border-radius: 12px;
      display: block;
      margin: 0 auto 20px auto;
      animation: floatImg 6s ease-in-out infinite alternate;
    }

    button {
      padding: 12px 26px;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      border: none;
      border-radius: 10px;
      color: white;
      font-weight: 700;
      cursor: pointer;
      font-size: 1rem;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      box-shadow: 0 6px 18px rgba(0, 188, 212, 0.3);
    }

    button:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 24px rgba(0, 188, 212, 0.4);
    }

    footer {
      margin-top: 40px;
      color: var(--muted);
      font-size: 0.9rem;
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes floatImg {
      from { transform: translateY(0); }
      to { transform: translateY(-10px); }
    }
  </style>
</head>
<body>
  <h1>🌊 Emoção detectada:</h1>
  <h2 id="emocaoTitle">Processando...</h2>
  <p id="confTitle"></p>

  <div class="card">
    <img id="imagemEmocao" alt="Imagem relacionada à emoção" />
    <button onclick="voltar()">Voltar</button>
  </div>

  <footer>© <span id="year"></span> EcoMaris — Protegendo a Vida nos Oceanos</footer>

  <script>
    const imagensPorEmocao = {
      feliz: [
        'static/mar_feliz/1.jpg',
      ],
      triste: [
        'static/mar_triste/1.png',
      ],
      neutro: [
        'static/mar_neutro/1.png',
      ]
    };

    const traducoes = {
      happy: 'feliz',
      sad: 'triste',
      neutral: 'neutro',
      angry: 'triste',
      fearful: 'triste',
      disgusted: 'triste',
      surprised: 'feliz'
    };

    function getQueryParam(name) {
      const params = new URLSearchParams(window.location.search);
      return params.get(name);
    }

    function imagemAleatoria(lista) {
      return lista[Math.floor(Math.random() * lista.length)];
    }

    const emocaoOriginal = getQueryParam('emocao') || 'neutral';
    const conf = getQueryParam('conf') || '0';
    const emocaoTraduzida = traducoes[emocaoOriginal] || 'nenhuma';

    document.getElementById('emocaoTitle').innerText =
      emocaoTraduzida.charAt(0).toUpperCase() + emocaoTraduzida.slice(1);
    document.getElementById('confTitle').innerText = `Confiança: ${conf}%`;
    document.getElementById('year').textContent = new Date().getFullYear();

    if (imagensPorEmocao[emocaoTraduzida] && imagensPorEmocao[emocaoTraduzida].length > 0) {
      document.getElementById('imagemEmocao').src = imagemAleatoria(imagensPorEmocao[emocaoTraduzida]);
    } else {
      document.getElementById('imagemEmocao').style.display = 'none';
    }

    function voltar() {
      window.location.href = 'index.html';
    }
  </script>
</body>
</html>
